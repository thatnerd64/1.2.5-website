<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bytecoder WasmGC - Hello World</title>
    <style>
        body {
            background-color: #121214;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #5865f2; }
        .card {
            background: #1e1f22;
            border: 1px solid #35363c;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        pre {
            background: #0f1012;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            color: #57f287;
            font-size: 14px;
            line-height: 1.4;
        }
        button {
            background-color: #5865f2;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        button:hover { background-color: #4752c4; }
        .badge {
            display: inline-block;
            background: #2b2d31;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #949ba4;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Bytecoder WebAssembly (WasmGC) Engine</h1>
    <span class="badge">Engine: Bytecoder 2024-05-10 | Target: WebAssembly WasmGC</span>
    <p>This demo verifies execution of Java bytecode compiled to modern WebAssembly Garbage Collection (WasmGC) running directly in the browser.</p>

    <div class="card">
        <button id="runBtn" onclick="runDemo()">Run Java WasmGC Binary</button>
        <p><strong>Console Output:</strong></p>
        <pre id="output">Click 'Run Java WasmGC Binary' to execute...</pre>
    </div>

    <script src="dist/hello_runtime.js"></script>
    <script>
        const out = document.getElementById('output');
        
        // Intercept bytecoder standard output
        bytecoder.filehandles[1] = {
            V$writeBytes$$B$I$I: function(fd, b, off, len) {
                const decoder = new TextDecoder();
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = bytecoder.instance.exports.getByteArrayEntry(null, b, off + i);
                }
                const text = decoder.decode(bytes);
                out.textContent += text;
                console.log(text);
            },
            V$writeInt$I: function(fd, value) {
                out.textContent += String.fromCharCode(value);
            }
        };

        async function runDemo() {
            out.textContent = "Loading WebAssembly module (dist/hello_wasmclasses.wasm)...\n";
            try {
                const response = await fetch('dist/hello_wasmclasses.wasm');
                const wasmBytes = await response.arrayBuffer();
                const { module, instance } = await WebAssembly.instantiate(wasmBytes, bytecoder.imports);
                
                bytecoder.init(module, instance);
                bytecoder.bootstrap();
                bytecoder.initializeFileIO();
                out.textContent += "Bootstrapped WebAssembly runtime successfully!\n\n";

                if (instance.exports.main) {
                    instance.exports.main(null, null);
                }
                out.textContent += "\n[Done: Java execution completed without errors]";
            } catch (err) {
                out.textContent += "\nError: " + err;
                console.error(err);
            }
        }
    </script>
</body>
</html>
